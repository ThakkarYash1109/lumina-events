version: '3.8'

services:
  lumina-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina-marketplace-core
    ports:
      - "8080:8080"
    environment:
      - LUMINA_ENV=production
      - LUMINA_PORT=8080
      - ESCROW_SANDBOX_ENABLED=true
    volumes:
      - lumina-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  lumina-data:
    driver: local

