    <path d="M78 84 Q87 81 94 85" stroke="#2d1c13" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M122 84 Q113 81 106 85" stroke="#2d1c13" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Stylish Round Specs (Architect/QA aesthetic) -->
    <circle cx="85" cy="93" r="11" fill="none" stroke="#d2b48c" stroke-width="1.8"/>
    <circle cx="115" cy="93" r="11" fill="none" stroke="#d2b48c" stroke-width="1.8"/>
    <line x1="96" y1="93" x2="104" y2="93" stroke="#d2b48c" stroke-width="1.8"/>
    <!-- Eyes inside glasses -->
