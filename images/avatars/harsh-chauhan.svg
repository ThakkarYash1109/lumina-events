    <circle cx="68" cy="170" r="3" fill="#e5d2a4"/>
    <!-- Neck -->
    <rect x="86" y="118" width="28" height="30" rx="3" fill="#dfad83"/>
    <!-- Head -->
    <ellipse cx="100" cy="94" rx="34" ry="39" fill="#e8bb92"/>
    <!-- Ears -->
    <circle cx="65" cy="95" r="7" fill="#dfad83"/>
    <circle cx="135" cy="95" r="7" fill="#dfad83"/>
    <!-- Textured Short Crop Hair -->
    <path d="M64 88 C63 60 76 52 100 52 C124 52 137 60 136 88 C130 76 120 72 100 71 C80 72 70 76 64 88 Z" fill="#2d1c13"/>
