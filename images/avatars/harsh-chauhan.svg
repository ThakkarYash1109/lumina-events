    <ellipse cx="115" cy="93" rx="3.5" ry="2.5" fill="#2d1c13"/>
    <!-- Nose -->
    <path d="M100 93 L98 106 L103 106" stroke="#ca9b72" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
