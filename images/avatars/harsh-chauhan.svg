      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#241710"/>
    </linearGradient>
    <linearGradient id="goldRing3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5d2a4"/>
      <stop offset="50%" stop-color="#d2b48c"/>
      <stop offset="100%" stop-color="#997b52"/>
    </linearGradient>
    <clipPath id="circleClip3">
      <circle cx="100" cy="100" r="92"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="97" fill="url(#goldRing3)" />
  <circle cx="100" cy="100" r="93" fill="url(#bgGrad3)" />
  
  <g clip-path="url(#circleClip3)">
