<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#241710"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5d2a4"/>
      <stop offset="50%" stop-color="#d2b48c"/>
      <stop offset="100%" stop-color="#997b52"/>
    </linearGradient>
    <clipPath id="circleClip1">
      <circle cx="100" cy="100" r="92"/>
    </clipPath>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="100" cy="100" r="97" fill="url(#goldRing)" />
  <circle cx="100" cy="100" r="93" fill="url(#bgGrad1)" />
  
  <g clip-path="url(#circleClip1)">
    <!-- Suit / Blazer -->
    <path d="M35 210 L65 145 L100 162 L135 145 L165 210 Z" fill="#1b120c"/>
    <!-- Gold Lapel accents -->
    <path d="M65 145 L85 160 L100 210 L100 162 Z" fill="#2d1e16" stroke="#d2b48c" stroke-width="1.2"/>
    <path d="M135 145 L115 160 L100 210 L100 162 Z" fill="#2d1e16" stroke="#d2b48c" stroke-width="1.2"/>
    <!-- Shirt -->
    <polygon points="85,145 115,145 100,165" fill="#f5f0e6"/>
    <!-- Necktie -->
    <polygon points="97,152 103,152 102,185 98,185" fill="#d2b48c"/>
    <!-- Neck -->
    <rect x="86" y="118" width="28" height="32" rx="4" fill="#d8a87b"/>
    <path d="M86 130 C95 138 105 138 114 130 Z" fill="#bf8f63"/>
    <!-- Head / Face -->
    <ellipse cx="100" cy="94" rx="34" ry="40" fill="#e0b288"/>
    <!-- Ears -->
    <circle cx="65" cy="95" r="7" fill="#d8a87b"/>
    <circle cx="135" cy="95" r="7" fill="#d8a87b"/>
    <!-- Professional Modern Pompadour Hair (Dark Coffee) -->
    <path d="M64 88 C63 60 80 50 100 50 C120 50 137 60 136 88 C130 76 122 72 100 70 C78 72 70 76 64 88 Z" fill="#2b1a11"/>
    <!-- Eyebrows -->
    <path d="M78 85 Q88 82 95 86" stroke="#2b1a11" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M122 85 Q112 82 105 86" stroke="#2b1a11" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="86" cy="93" rx="4" ry="2.5" fill="#2b1a11"/>
    <ellipse cx="114" cy="93" rx="4" ry="2.5" fill="#2b1a11"/>
    <!-- Nose -->
    <path d="M100 93 L97 106 L104 106" stroke="#c9976b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Confident Smile -->
    <path d="M89 116 Q100 123 111 116" stroke="#94633e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>

